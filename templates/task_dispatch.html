<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Task Dispatch - Rapid Labs</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    padding:25px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.page-title{
    font-size:30px;
    font-weight:700;
    color:#0b3c6d;
    margin-bottom:20px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:600;
    color:#374151;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #dcdfe4;
    border-radius:8px;
    padding:12px;
    font-size:14px;
    outline:none;
}

textarea{
    resize:vertical;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

button,
.action-link{

    border:none;
    border-radius:8px;
    padding:12px 18px;
    cursor:pointer;
    text-decoration:none;
    color:#fff;
    font-size:14px;
}

.primary{
    background:#0b63ce;
}

.success{
    background:#16a34a;
}

.dark{
    background:#1f2937;
}

.orange{
    background:#ea580c;
}

.preview-box{
    margin-top:25px;
}

#collectorMessage{
    height:280px;
}

@media(max-width:768px){

    body{
        padding:12px;
    }

    .container{
        width:100%;
    }

    .card{
        padding:15px;
        border-radius:10px;
    }

    .page-title{
        font-size:24px;
        margin-bottom:15px;
    }

    .grid{
        grid-template-columns:1fr;
        gap:12px;
    }

    .full{
        grid-column:auto;
    }

    input,
    select,
    textarea{
        font-size:16px;
        padding:12px;
    }

    .buttons{
        flex-direction:column;
    }

    button,
    .action-link{
        width:100%;
        text-align:center;
        padding:14px;
        font-size:15px;
    }

    #collectorMessage{
        height:220px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="page-title">
Task Dispatch
</div>

<div class="card">

<div class="grid">

<div>
<label>Patient Name</label>
<input id="pName">
</div>

<div>
<label>Age</label>
<input id="pAge">
</div>

<div>
<label>Mobile Number</label>
<input id="pMobile">
</div>

<div>
<label>Gender</label>
<select id="pGender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div>
<label>Package</label>
<select id="pPackage">

<option value="">Select Package</option>

<option>Full Body Checkup Basic</option>
<option>Full Body Checkup Advanced</option>
<option>Vitamin Profile</option>
<option>Vitamin D Package</option>
<option>Diabetes Profile</option>
<option>Thyroid Profile</option>
<option>CBC</option>
<option>LFT</option>
<option>KFT</option>
<option>Lipid Profile</option>

</select>
</div>

<div>
<label>Status</label>
<select id="pStatus">

<option>New Lead</option>
<option>Confirmed</option>
<option>Not Confirmed</option>
<option>Follow Up</option>
<option>Rescheduled</option>
<option>Sample Collected</option>
<option>Processing</option>
<option>Report Ready</option>
<option>Delivered</option>
<option>Cancelled</option>

</select>
</div>

<div>
<label>Collection Date</label>
<input
type="date"
id="pDate">
</div>

<div>
<label>Collection Time</label>
<select id="pTime">

<option>06:00 AM</option>
<option>06:30 AM</option>
<option>07:00 AM</option>
<option>07:30 AM</option>
<option>08:00 AM</option>
<option>08:30 AM</option>
<option>09:00 AM</option>
<option>09:30 AM</option>
<option>10:00 AM</option>
<option>10:30 AM</option>
<option>11:00 AM</option>
<option>11:30 AM</option>
<option>12:00 PM</option>
<option>12:30 PM</option>
<option>01:00 PM</option>
<option>01:30 PM</option>
<option>02:00 PM</option>
<option>02:30 PM</option>
<option>03:00 PM</option>
<option>03:30 PM</option>
<option>04:00 PM</option>
<option>04:30 PM</option>
<option>05:00 PM</option>
<option>05:30 PM</option>
<option>06:00 PM</option>

</select>
</div>

<div class="full">
<label>Address</label>

<textarea
id="pLocation"
rows="4">
</textarea>
</div>

<div class="full">
<label>Collector Notes</label>

<textarea
id="pNotes"
rows="3"
placeholder="Fasting sample, landmark, special instructions etc.">
</textarea>
</div>

</div>

<div class="buttons">

<button
class="primary"
onclick="generateMessage()">
Generate Message
</button>

<button
class="dark"
onclick="copyTask()">
Copy Message
</button>

<button
class="success"
onclick="openWhatsapp()">
WhatsApp
</button>

<a
id="mapsLink"
class="action-link success"
target="_blank">
Open Maps
</a>

<button
class="orange"
onclick="clearForm()">
Clear
</button>

</div>

<div class="preview-box">

<label>
Collector Message Preview
</label>

<textarea
id="collectorMessage">
</textarea>

</div>

</div>

</div>

<script>

function updateMap(){

    const location =
        document.getElementById(
            "pLocation"
        ).value;

    document.getElementById(
        "mapsLink"
    ).href =
        "https://www.google.com/maps/search/?api=1&query="
        + encodeURIComponent(location);
}

function generateMessage(){

    updateMap();

    const msg =

`🏥 RAPID LABS

━━━━━━━━━━━━━━

NAME :${pName.value}
MOBILE :${pMobile.value}
Age/sex :${pAge.value} | ${pGender.value}

Test/package :${pPackage.value}

date :${pDate.value}
time :${pTime.value}

location  :${pLocation.value}

${pNotes.value ? "📝 " + pNotes.value + "\n" : ""}

🗺️ ${mapsLink.href}

━━━━━━━━━━━━━━`;

    document.getElementById(
        "collectorMessage"
    ).value = msg;
}

function copyTask(){

    generateMessage();

    navigator.clipboard.writeText(
        document.getElementById(
            "collectorMessage"
        ).value
    );

    alert("Message copied");
}

function openWhatsapp(){

    generateMessage();

    const msg =
        encodeURIComponent(
            document.getElementById(
                "collectorMessage"
            ).value
        );

    window.open(
        "https://wa.me/?text=" + msg,
        "_blank"
    );
}

function clearForm(){

    document.querySelectorAll(
        "input, textarea"
    ).forEach(el => {

        if(
            el.type !== "date"
        ){
            el.value = "";
        }

    });

    document.querySelectorAll(
        "select"
    ).forEach(el => {

        el.selectedIndex = 0;

    });

    document.getElementById(
        "collectorMessage"
    ).value = "";
}

</script>

</body>
</html>
